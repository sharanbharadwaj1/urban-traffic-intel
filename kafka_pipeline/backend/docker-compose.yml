services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-video-analytics-api-kafka
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - postgres
      - neo4j
    environment:
      DATABASE_URL: postgresql+psycopg://traffic1:traffic1@postgres:5432/trafficdb1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_JOB_TOPIC: video_jobs
      KAFKA_JOB_GROUP_ID: video_job_workers
      STORAGE_BACKEND: local
      MODEL_PATH: yolov8n.pt
      FRAME_SKIP: 5
      CONFIDENCE_THRESHOLD: 0.35
      SAVE_EVENT_SNAPSHOTS: ${SAVE_EVENT_SNAPSHOTS:-true}
      PLATE_ENABLED: ${PLATE_ENABLED:-true}
      ANPR_API_TOKEN: ${ANPR_API_TOKEN:-"f27d131868069151c84f1f7fcea4412a47267412"}
      ANPR_API_URL: ${ANPR_API_URL:-https://api.platerecognizer.com/v1/plate-reader/}
      ANPR_COUNTRY: ${ANPR_COUNTRY:-in}
      ANPR_MIN_SCORE: ${ANPR_MIN_SCORE:-0.5}
      GRAPH_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-video-analytics-worker-kafka
    command: python -m app.worker
    env_file:
      - .env
    depends_on:
      - kafka
      - postgres
      - neo4j
    environment:
      DATABASE_URL: postgresql+psycopg://traffic1:traffic1@postgres:5432/trafficdb1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_JOB_TOPIC: video_jobs
      KAFKA_JOB_GROUP_ID: video_job_workers
      STORAGE_BACKEND: local
      MODEL_PATH: yolov8n.pt
      FRAME_SKIP: 5
      CONFIDENCE_THRESHOLD: 0.35
      SAVE_EVENT_SNAPSHOTS: ${SAVE_EVENT_SNAPSHOTS:-true}
      PLATE_ENABLED: ${PLATE_ENABLED:-true}
      ANPR_API_TOKEN: ${ANPR_API_TOKEN:-"f27d131868069151c84f1f7fcea4412a47267412"}
      ANPR_API_URL: ${ANPR_API_URL:-https://api.platerecognizer.com/v1/plate-reader/}
      ANPR_COUNTRY: ${ANPR_COUNTRY:-in}
      ANPR_MIN_SCORE: ${ANPR_MIN_SCORE:-0.5}
      GRAPH_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: traffic-video-analytics-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: traffic-video-analytics-postgres-kafka
    environment:
      POSTGRES_DB: trafficdb1
      POSTGRES_USER: traffic1
      POSTGRES_PASSWORD: traffic1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: traffic-video-analytics-neo4j-kafka
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:
  neo4j_data:
